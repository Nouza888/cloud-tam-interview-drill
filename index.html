から複雑なタスク、PC操作まで一つの環境で進められること**を理由にCodexを使っています。\n\n当初は、情報収集やメール文面の提案は軽いモデル、SR全件分析や資料作成などは重めのモデルという使い分けを説明しました。ただし深掘りを通じて、**必要な能力や品質に基づく選定は十分に考えられていなかった**と認識しました。比較測定はまだ行っておらず、現在は判断軸と比較方法を学んでいる段階です。","points":"本人の現在地\n・ツール：会社承認と、作業を一つの環境で進められること。\n・モデル：当初は軽い仕事／複雑な仕事という大まかな判断。\n・訂正：能力・品質を比較した選定までは未実施。","notes":"回答の位置付け：本人の初稿と、その後の「あまりできていなかった」という訂正を合わせた整理。初稿の使い分け自体を取り消さず、比較・評価に基づく選定実績へ広げない。モデル選択と今後の学習方針を分ける。","theme":"技術・運用判断","relatedQuestions":[],"relatedTerms":[],"status":"本人の初稿と、その後の「あまりできていなかった」という訂正を合わせた整理。初稿の使い分け自体を取り消さず、比較・評価に基づく選定実績へ広げない。モデル選択と今後の学習方針を分ける。"},{"id":"T44","question":"AI活用を考えるとき、モデル・思考量・ワークフロー・検証はどう分けますか。","answer":"**モデルは必要な能力、思考量は判断へ割く検討、ワークフローは作業の分け方、検証は使える結果かの確認**として分けます。\n\n例えば、長文や複数資料、ツール利用が必要かはモデルを考える材料です。曖昧さ、矛盾、複数案の比較は、思考量を検討する材料になります。取得、集計、判断、文章化をどう分けるかはワークフローです。\n\n最後に、根拠の有無や余計な推測、人が直す量などで出力を確かめます。一つを強くすれば全部解決するとは考えません。","points":"【モデル選択の学習】\n・モデル：文章・長文・複数資料・ツール等の能力。\n・思考量：曖昧さ・矛盾・比較への検討。\n・workflow：取得・集計・判断・文章化を分割。\n・検証：利用可能な結果の基準。","notes":"回答の位置付け：このチャットで説明した一般モデル。本人がこれらを十分使い分けてきた実績ではない。本人の「あまりできてなかった」という訂正と併せて扱う。","theme":"技術・運用判断","relatedQuestions":[],"relatedTerms":[],"status":"このチャットで説明した一般モデル。本人がこれらを十分使い分けてきた実績ではない。本人の「あまりできてなかった」という訂正と併せて扱う。"},{"id":"T45","question":"AIモデルをこれから選ぶなら、何を比較して判断しますか。","answer":"一般的な選び方の案として、まず**業務で必要な能力と、使える結果の基準**を決めます。文章生成、長い文脈、複数資料、ツールの利用など、必要な能力に合うモデルを候補にします。\n\n比較するなら、入力、プロンプト、ツール、品質基準をそろえ、モデルか思考量の一方ずつを変えます。拾えた問題、根拠、余計な推測、人の修正時間を見て、所要時間や費用も含めて判断します。\n\nこれは今後の比較案です。**私自身はこうした比較をまだ実施していません。**","points":"【AI学習・モデル選定方針】\n【モデル選定の比較案】\n・先に用途と品質基準を決める。\n・入力・prompt・tool・基準をそろえる。\n・モデルまたは思考量を一つずつ変更。\n・問題の検出、根拠、余計な推測、修正時間を比べる。\n・本人の比較実績は未確認。","notes":"回答の位置付け：一般モデル・今後の提案。本人はモデル選択を十分できていなかったと訂正済み。この回答を過去の使い分け実績として保存しない。","theme":"技術・運用判断","relatedQuestions":[],"relatedTerms":[],"status":"一般モデル・今後の提案。本人はモデル選択を十分できていなかったと訂正済み。この回答を過去の使い分け実績として保存しない。"},{"id":"T46","question":"SRが100件ある場合は、すべて高い思考量のAIで処理すべきですか。","answer":"**件数が多いことと、判断が難しいことは別**です。取得済みデータの集計や差分は機械処理で扱える部分があり、定型的な事実抽出は軽い設定も候補になります。\n\n一方、顧客の質問と回答のずれ、矛盾、複数の事情の比較には、判断力や思考量を検討する余地があります。確認済み内容の文面化も軽い設定の候補ですが、事実が変わっていないかは確かめます。\n\n初期設定から試し、必要な部分だけ上げる案です。高い思考量は改善する場合があっても、時間やトークンの使用が増えるため、一律には選びません。","points":"【量と難しさ】\n・大量データ：取得・集計・差分と、内容判断を分ける。\n・難しい判断：意図ずれ、矛盾、比較。\n・開始点：初期設定。必要なら上げて比較。\n・高effortの効果はタスク依存。","notes":"回答の位置付け：学習上の選定案。本人が各工程で実際にモデル・effortを切り替え、測定したという実績はない。軽い設定で必ず十分、高い設定で必ず正確とは言わない。","theme":"技術・運用判断","relatedQuestions":[],"relatedTerms":[],"status":"学習上の選定案。本人が各工程で実際にモデル・effortを切り替え、測定したという実績はない。軽い設定で必ず十分、高い設定で必ず正確とは言わない。"},{"id":"T47","question":"SRの確認では、通常のスクリプトとAIをどう使い分けますか。","answer":"一般的な分担案として、**取得済みデータの集計や差分など、手順が決まる処理は機械処理**へ分けます。AIは、質問と回答の意味のずれなど、文脈を整理して判断候補を出す部分に使います。\n\nその後、人が原文を確認してフォローを判断します。全工程をAIに任せる前提ではなく、取得・集計・判断・文章化を分ける考え方です。\n\n現在のSRチェックでは文脈分析に価値を感じていますが、**通常の自動化との比較試験を実施したとは言いません。**","points":"【処理の分担案】\n・スクリプト等：取得済みデータの集計・差分。\n・AI：意味や文脈の整理、確認候補の抽出。\n・人：根拠確認と対応判断。\n・通常自動化との比較実績は未確認。","notes":"回答の位置付け：一般モデル・今後の分担案。現行の取得・集計がすべてスクリプト実装済み、AIだけが意図ずれを検出可能、という主張にはしない。","theme":"技術・運用判断","relatedQuestions":[],"relatedTerms":[],"status":"一般モデル・今後の分担案。現行の取得・集計がすべてスクリプト実装済み、AIだけが意図ずれを検出可能、という主張にはしない。"},{"id":"T48","question":"短い顧客メールなら、AIの出力確認を軽くしてよいですか。","answer":"**文章の短さだけでは、確認の厚さは決められません。** 復旧状況、費用、期限、対応の約束などを含む短いメールは、誤ると顧客の判断へ影響します。\n\n文面作成自体には軽い設定が候補でも、確認済みの事実と一致するか、未確定事項を断定していないか、できない約束を加えていないかを人が確認する考え方です。\n\n作成に必要な計算・思考の量と、誤った場合の影響を分けて考えます。","points":"【生成負荷と確認の厚さ】\n・短文でも復旧・期限・約束は影響が大きい。\n・事実と確度を維持する。\n・モデルの設定だけで人の確認を省かない。","notes":"回答の位置付け：このチャットの一般的な学習説明。特定メールで実際にどの設定・確認手順を使ったかの記録ではない。","theme":"技術・運用判断","relatedQuestions":[],"relatedTerms":[],"status":"このチャットの一般的な学習説明。特定メールで実際にどの設定・確認手順を使ったかの記録ではない。"},{"id":"B52","question":"AI活用で失敗した経験と、その後の改善を教えてください。","answer":"未回答。このチャットでは、まだ回答を作成していません。","points":"【AI活用・未回答の経験質問】\n・必要な材料：AIが何を誤ったか、自分がどう扱ったか、誰に何が起きたか。\n・発見後の修正と、変更した確認手順。\n・人がチェックしていること自体を失敗談にしない。","notes":"回答の位置付け：未回答。この会話では、実際の誤判定・情報漏えい・誤送信などの本人事例が確認できていない。一般的なリスクや仮定の有害用途から失敗実績を作らない。","theme":"技術・運用判断","relatedQuestions":[],"relatedTerms":[],"status":"未回答。この会話では、実際の誤判定・情報漏えい・誤送信などの本人事例が確認できていない。一般的なリスクや仮定の有害用途から失敗実績を作らない。"},{"id":"B53","question":"顧客から「生成AIを業務に導入したい」と相談されたら、どのように支援しますか。","answer":"未回答。このチャットでは、まだ回答を作成していません。","points":"【AI活用・未回答の経験質問】\n・必要な材料：顧客課題、利用者、扱うデータ、制約。\n・本人が行った提案・検証・関係者調整の範囲。\n・導入・利用・効果の確認結果。\n・社内SR分析の経験を顧客の生成AI導入実績へ変換しない。","notes":"回答の位置付け：未回答の仮想質問。このチャットでは対応方針の回答をまだ作成していない。仮想回答に本人の導入実績を必須とするものではないが、今は新しい一般回答で補完しない。","theme":"顧客対応・信頼","relatedQuestions":[],"relatedTerms":[],"status":"未回答の仮想質問。このチャットでは対応方針の回答をまだ作成していない。仮想回答に本人の導入実績を必須とするものではないが、今は新しい一般回答で補完しない。"},{"id":"T49","question":"顧客からAIに向かない用途を相談されたら、どう説明しますか。","answer":"未回答。このチャットでは、まだ回答を作成していません。","points":"【未回答の想定質問】\n・顧客が解決したい課題と要求を聞く。\n・AI以外の方法も比較する論点。\n・品質・情報取扱い・運用上の制約を説明する論点。\n・本人の初回答と確認が必要。","notes":"回答の位置付け：未回答の仮想質問。このチャットでは対応方針の回答をまだ作成していない。仮想回答に本人の導入実績を必須とするものではないが、今は新しい一般回答で補完しない。","theme":"技術・運用判断","relatedQuestions":[],"relatedTerms":[],"status":"未回答の仮想質問。このチャットでは対応方針の回答をまだ作成していない。仮想回答に本人の導入実績を必須とするものではないが、今は新しい一般回答で補完しない。"},{"id":"T50","question":"顧客のAI導入を支援するとき、TAMとAI専門家の役割をどう分けますか。","answer":"未回答。このチャットでは、まだ回答を作成していません。","points":"【未回答の想定質問】\n・顧客課題・条件と、技術検証の役割分担。\n・TAMが整理・調整する範囲。\n・専門家へ依頼する検証・設計。\n・具体的な組織の責任範囲を確認してから答える。","notes":"回答の位置付け：未回答の仮想質問。このチャットでは対応方針の回答をまだ作成していない。仮想回答に本人の導入実績を必須とするものではないが、今は新しい一般回答で補完しない。","theme":"技術・運用判断","relatedQuestions":[],"relatedTerms":[],"status":"未回答の仮想質問。このチャットでは対応方針の回答をまだ作成していない。仮想回答に本人の導入実績を必須とするものではないが、今は新しい一般回答で補完しない。"}],"glossary":[{"id":"sli","term":"SLI","fullName":"Service Level Indicator","definition":"利用者が受け取るサービス品質を数値で測る指標。成功率、応答時間、データの鮮度など、対象と測定方法を定める。","example":"対象APIへのリクエストのうち、正常に完了した割合を直近30日で測る。","caution":"CPU使用率だけでは、利用者が業務を完了できたかを直接は判断できない。指標の定義と実測値を区別する。","sources":[{"label":"Google SRE：Service Level Objectives","url":"https://sre.google/sre-book/service-level-objectives/"}],"referenceText":"Google SRE：Service Level Objectives\nhttps://sre.google/sre-book/service-level-objectives/"},{"id":"slo","term":"SLO","fullName":"Service Level Objective","definition":"SLIに対して設定するサービス品質の目標。目標値だけでなく、対象、評価期間、良い状態の定義を合意する。","example":"直近30日で、対象APIの99.9%以上を正常に完了させる。","caution":"目標の設定だけでは達成したことにならない。SLAと同じ値や測定条件とは限らない。","sources":[{"label":"Google SRE：Service Level Objectives","url":"https://sre.google/sre-book/service-level-objectives/"}],"referenceText":"Google SRE：Service Level Objectives\nhttps://sre.google/sre-book/service-level-objectives/"},{"id":"sla","term":"SLA","fullName":"Service Level Agreement","definition":"サービス提供者と顧客の間で合意するサービス水準や条件。未達時の措置・補償、対象範囲、除外条件などを契約で定める。","example":"稼働率の測定条件と、条件を満たした未達時のサービスクレジットを確認する。","caution":"「絶対に止まらない」という約束ではない。製品のSLAだけで、アプリ全体の可用性や業務損失の補償は判断できない。","sources":[{"label":"Google SRE：Service Level Objectives","url":"https://sre.google/sre-book/service-level-objectives/"}],"referenceText":"Google SRE：Service Level Objectives\nhttps://sre.google/sre-book/service-level-objectives/"},{"id":"error-budget","term":"エラーバジェット","fullName":"Error Budget","definition":"SLOを満たしながら許容できる失敗の余地。残量や消費速度を、変更の進め方と信頼性改善の判断に使う。","example":"100万リクエストの成功率目標が99.9%なら、失敗の許容枠は1,000件。","caution":"停止時間で数えるかリクエストで数えるかはSLIによる。毎回障害を起こしてよいという権利ではない。","sources":[{"label":"Google SRE：Embracing Risk","url":"https://sre.google/sre-book/embracing-risk/"}],"referenceText":"Google SRE：Embracing Risk\nhttps://sre.google/sre-book/embracing-risk/"},{"id":"rto","term":"RTO","fullName":"Recovery Time Objective","definition":"障害発生後、業務やサービスを復旧させるまでに許容する時間の目標。検知・判断・復旧・業務確認の工程を踏まえて設計する。","example":"重要業務を障害発生から1時間以内に再開できるよう、手順と訓練を整える。","caution":"設定した目標と実際の復旧所要時間は別。VMの起動完了だけでは業務復旧の完了にならない。","sources":[{"label":"Google Cloud：Disaster recovery planning guide","url":"https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide"}],"referenceText":"Google Cloud：Disaster recovery planning guide\nhttps://docs.cloud.google.com/architecture/dr-scenarios-planning-guide"},{"id":"rpo","term":"RPO","fullName":"Recovery Point Objective","definition":"障害時、どの時点までのデータを復旧できる必要があるかを表す目標。通常は許容できるデータ損失の時間幅で示す。","example":"RPOが15分なら、障害直前から最大15分分の更新損失を許容する要件として検討する。","caution":"バックアップを15分ごとに設定するだけで達成を保証できない。取得成功、複製遅延、復元可能性も確認する。","sources":[{"label":"Google Cloud：Disaster recovery planning guide","url":"https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide"}],"referenceText":"Google Cloud：Disaster recovery planning guide\nhttps://docs.cloud.google.com/architecture/dr-scenarios-planning-guide"},{"id":"spof","term":"SPOF","fullName":"Single Point of Failure","definition":"その一箇所が故障すると、対象サービスや業務全体を止めてしまう単一障害点。アプリ、DB、ネットワーク、認証などを横断して確認する。","example":"アプリが2台でも、両方が依存する認証サーバーが1台だけなら、そこがSPOFになり得る。","caution":"台数を増やすだけでは共通依存先の障害を防げない。切り替え後の処理能力不足も別途確認する。","sources":[{"label":"Google Cloud：Building blocks of reliability","url":"https://docs.cloud.google.com/architecture/infra-reliability-guide/building-blocks"}],"referenceText":"Google Cloud：Building blocks of reliability\nhttps://docs.cloud.google.com/architecture/infra-reliability-guide/building-blocks"},{"id":"redundancy","term":"冗長化","fullName":"Redundancy","definition":"一部の故障時も処理を継続できるよう、機能やリソースを複数用意すること。配置先と共通依存関係を考慮する。","example":"異なるゾーンへアプリを配置し、一方の障害時には残りで必要な負荷を処理する。","caution":"誤更新や論理的な破損が複製される場合がある。冗長化とバックアップは役割が異なる。","sources":[{"label":"Google Cloud：Building blocks of reliability","url":"https://docs.cloud.google.com/architecture/infra-reliability-guide/building-blocks"}],"referenceText":"Google Cloud：Building blocks of reliability\nhttps://docs.cloud.google.com/architecture/infra-reliability-guide/building-blocks"},{"id":"backup","term":"バックアップ","fullName":"Backup","definition":"データや構成を、必要な時点の状態へ復元するために別のコピーとして保持すること。取得と保管に加えて復元手順を準備する。","example":"誤削除に備えた世代管理を行い、復元したデータで業務を再開できるか定期的に試験する。","caution":"取得成功だけでは復旧可能性を証明できない。復元に必要な時間・鍵・権限・依存システムも確認する。","sources":[{"label":"Google Cloud：Disaster recovery planning guide","url":"https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide"}],"referenceText":"Google Cloud：Disaster recovery planning guide\nhttps://docs.cloud.google.com/architecture/dr-scenarios-planning-guide"},{"id":"ha","term":"HA","fullName":"High Availability","definition":"故障やメンテナンスによる利用不能時間を抑えるための構成・仕組み・運用。冗長化、障害検知、切り替えなどを組み合わせる。","example":"プライマリDBが使えない場合に、待機系へ切り替えてサービスを再開する。","caution":"HA構成でも切り替え時間や既存接続の切断は起こり得る。対応する障害範囲も確認する。","sources":[{"label":"Cloud SQL：About high availability","url":"https://docs.cloud.google.com/sql/docs/postgres/high-availability"}],"referenceText":"Cloud SQL：About high availability\nhttps://docs.cloud.google.com/sql/docs/postgres/high-availability"},{"id":"dr","term":"DR","fullName":"Disaster Recovery","definition":"広域障害など通常の運用では継続できない事態から、ITサービスを復旧させるための構成・データ・手順・訓練。","example":"リージョン障害を想定し、別リージョンでデータと依存システムを使って業務を再開する。","caution":"別リージョンにデータがあるだけでは不十分。認証、DNS、ネットワーク、容量、担当者の行動も復旧計画に含める。","sources":[{"label":"Google Cloud：Disaster recovery planning guide","url":"https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide"}],"referenceText":"Google Cloud：Disaster recovery planning guide\nhttps://docs.cloud.google.com/architecture/dr-scenarios-planning-guide"},{"id":"failover","term":"フェイルオーバー","fullName":"Failover","definition":"稼働系の障害時に、待機系や正常な処理先へ役割を切り替えること。自動または手動で行う。","example":"稼働中のDBが停止した際に、待機DBを新しい接続先として使う。","caution":"既存セッションや実行中トランザクションがそのまま継続するとは限らない。再接続・再試行・データ状態を確認する。","sources":[{"label":"Cloud SQL：About high availability","url":"https://docs.cloud.google.com/sql/docs/postgres/high-availability"}],"referenceText":"Cloud SQL：About high availability\nhttps://docs.cloud.google.com/sql/docs/postgres/high-availability"},{"id":"rollback","term":"切り戻し","fullName":"Rollback","definition":"変更や移行で問題が生じた際、事前に定めた手順で元の構成・運用状態へ戻すこと。実行条件と判断期限を合意しておく。","example":"移行後の業務確認に失敗したため、合意済みの手順で旧環境へ戻す。\n\n本チャットの補足：\nこの会話の実体験では、開発チームが基盤側の変更をロールバックし、その後のインスタンス再起動で復旧した。","caution":"移行先で更新が始まった後は、接続先だけ戻すとデータを失うおそれがある。差分データの扱いと戻せる段階を確認する。\n\n本チャットの補足：\nロールバックを実施した開発チームと、変更候補の共有・情報集約・顧客報告を担当したnozの寄与を分ける。再起動の実行者は未確認。","sources":[{"label":"AWS：Cutover stage and rollback","url":"https://docs.aws.amazon.com/prescriptive-guidance/latest/best-practices-migration-cutover/cutover-stage.html"}],"referenceText":"AWS：Cutover stage and rollback\nhttps://docs.aws.amazon.com/prescriptive-guidance/latest/best-practices-migration-cutover/cutover-stage.html"},{"id":"idempotency","term":"冪等性","fullName":"Idempotency","definition":"同じ操作を繰り返しても、対象の状態への効果が一度実行した場合と変わらない性質。再試行の安全性を考える基礎になる。","example":"一意のリクエストIDで決済要求の重複を検出し、同じ支払いを二重に処理しない。","caution":"同じ応答文字列が返ることとは限らない。タイムアウト時にも実処理は完了している可能性がある。","sources":[{"label":"Cloud Storage：Retry strategy","url":"https://docs.cloud.google.com/storage/docs/retry-strategy"}],"referenceText":"Cloud Storage：Retry strategy\nhttps://docs.cloud.google.com/storage/docs/retry-strategy"},{"id":"retry","term":"リトライ","fullName":"Retry","definition":"一時的な失敗から回復するために、要求や処理を再度実行すること。対象エラー、上限、待ち時間、重複実行の扱いを決める。","example":"接続切断後、新しいDB接続を取得して、安全性を確認した処理を再試行する。","caution":"無制限・即時の再試行は負荷を増やす。非冪等な更新は二重実行を防ぐ仕組みが必要。","sources":[{"label":"Cloud Storage：Retry strategy","url":"https://docs.cloud.google.com/storage/docs/retry-strategy"}],"referenceText":"Cloud Storage：Retry strategy\nhttps://docs.cloud.google.com/storage/docs/retry-strategy"},{"id":"backoff","term":"指数バックオフ","fullName":"Exponential Backoff","definition":"再試行を重ねるほど待ち時間を増やす制御。上限とランダムな揺らぎを組み合わせ、再試行の集中を抑える。","example":"待ち時間をおおむね1秒、2秒、4秒と増やし、各回に揺らぎを加える。","caution":"待ち時間だけを決めず、全体の締切と最大試行回数も検討する。認証失敗など恒久的な原因は再試行だけでは直らない。","sources":[{"label":"Cloud Storage：Retry strategy","url":"https://docs.cloud.google.com/storage/docs/retry-strategy"}],"referenceText":"Cloud Storage：Retry strategy\nhttps://docs.cloud.google.com/storage/docs/retry-strategy"},{"id":"latency","term":"レイテンシ","fullName":"Latency","definition":"要求を送ってから応答や処理完了までにかかる時間。利用者から見た全体時間と、処理区間ごとの時間を分けて測る。","example":"画面表示が20秒なら、通信、アプリ処理、DB接続待ち、SQL実行などの時間を調べる。","caution":"平均値だけでは一部の極端な遅延を見落とす。成功応答とエラー応答の時間も区別する。","sources":[{"label":"Google SRE：Monitoring Distributed Systems","url":"https://sre.google/sre-book/monitoring-distributed-systems/"}],"referenceText":"Google SRE：Monitoring Distributed Systems\nhttps://sre.google/sre-book/monitoring-distributed-systems/"},{"id":"throughput","term":"スループット","fullName":"Throughput","definition":"単位時間あたりに処理できた仕事量。要求数、トランザクション数、転送量など、対象に合う単位で表す。","example":"1秒間に処理を完了できたリクエスト数や、1分間のデータ取り込み量を確認する。","caution":"リクエスト数が多くても応答が速いとは限らない。到着量と完了量、待ち行列の増減も区別する。","sources":[{"label":"Google SRE：Service Level Objectives","url":"https://sre.google/sre-book/service-level-objectives/"},{"label":"Google SRE：Monitoring Distributed Systems","url":"https://sre.google/sre-book/monitoring-distributed-systems/"}],"referenceText":"Google SRE：Service Level Objectives\nhttps://sre.google/sre-book/service-level-objectives/\n\nGoogle SRE：Monitoring Distributed Systems\nhttps://sre.google/sre-book/monitoring-distributed-systems/"},{"id":"p95","term":"p95","fullName":"95th Percentile","definition":"測定値を小さい順に見たときの95パーセンタイル。レイテンシなら、概ね95%の要求がその値以下で、残りの約5%がより遅い。","example":"ある測定期間のp95応答時間が2秒なら、ほとんどの要求は2秒以内だが、それを超える要求もある。","caution":"平均値とは異なる。異なる時間帯やサーバーのp95を単純平均しても、全体のp95にはならない。","sources":[{"label":"Google SRE：Service Level Objectives","url":"https://sre.google/sre-book/service-level-objectives/"}],"referenceText":"Google SRE：Service Level Objectives\nhttps://sre.google/sre-book/service-level-objectives/"},{"id":"trace","term":"分散トレース","fullName":"Distributed Trace","definition":"一つの要求が複数のサービスを通る経路と、それぞれの処理時間・関係を記録する情報。通常は複数のspanから構成される。","example":"同じ要求のアプリ処理とDB呼び出しを関連付け、どの区間で待ち時間が増えたか確認する。","caution":"計測されていない区間やサンプリング対象外の要求は見えない。トレースにないことは処理がない証拠ではない。","sources":[{"label":"Cloud Trace：Overview","url":"https://docs.cloud.google.com/trace/docs/overview"}],"referenceText":"Cloud Trace：Overview\nhttps://docs.cloud.google.com/trace/docs/overview"},{"id":"connection-pool","term":"接続プール","fullName":"Connection Pool","definition":"作成したDB接続などを保持し、複数の要求で再利用する仕組み。接続作成の負担と同時接続数を管理する。","example":"プール内の接続が全て使用中で、アプリの要求が接続を借りるまで待つ。","caution":"接続待ちとSQL実行時間は別。プール上限の増加はDBの負荷や接続上限を悪化させる場合がある。","sources":[{"label":"Cloud SQL：Manage database connections","url":"https://docs.cloud.google.com/sql/docs/postgres/manage-connections"}],"referenceText":"Cloud SQL：Manage database connections\nhttps://docs.cloud.google.com/sql/docs/postgres/manage-connections"},{"id":"bottleneck","term":"ボトルネック","fullName":"Bottleneck","definition":"全体の処理速度や処理量を制約している区間・資源・依存先。負荷や処理内容に応じて場所が変わる。","example":"アプリ全体が遅くても、時間の大半がDB接続の取得待ちなら、その周辺の制約を調べる。","caution":"CPUが正常でも、I/O、ロック、接続、外部APIなどで待ちが発生する。相関だけで根本原因と断定しない。","sources":[{"label":"Cloud Trace：Overview","url":"https://docs.cloud.google.com/trace/docs/overview"},{"label":"Cloud SQL：Use system insights","url":"https://docs.cloud.google.com/sql/docs/postgres/use-system-insights"}],"referenceText":"Cloud Trace：Overview\nhttps://docs.cloud.google.com/trace/docs/overview\n\nCloud SQL：Use system insights\nhttps://docs.cloud.google.com/sql/docs/postgres/use-system-insights"},{"id":"os","term":"OS","fullName":"","definition":"CPUやメモリなどの資源を管理する、サーバーの土台となるソフトウェア。","example":"BaseDBの更新提案では、DBやGIとは別に、顧客管理領域のOSのバージョンも調査した。","caution":"DBだけを更新してもOSの不具合や脆弱性が修正されるとは限らない。各層の適用要否・互換性・更新順序を確認する。","sources":[],"referenceText":""},{"id":"db","term":"DB","fullName":"","definition":"データを保存・検索・更新するソフトウェア。この会話の更新提案では、DBソフトウェアのバージョンを対象にした。","example":"データ取り込みが想定時間内に終わらない事例では、DBへの取り込み処理の進捗と、CPU・メモリなどの観測情報を確認した。","caution":"DB呼び出しが遅いことだけで、DB製品の障害やCPU不足が原因と確定したことにはしない。","sources":[],"referenceText":""},{"id":"gi","term":"GI","fullName":"Grid Infrastructure","definition":"DBのストレージ管理や起動・監視などを支える基盤。具体的な機能は構成によって異なる。","example":"約80台のBaseDB更新提案では、DB・GI・OSのバージョンを一覧化し、候補や更新上の条件を整理した。","caution":"DB・GI・OSの役割や更新の必要性を分け、3つを毎回同時に更新するとは説明しない。","sources":[],"referenceText":""},{"id":"base-db","term":"BaseDB","fullName":"Base Database Service","definition":"この会話で、データ取り込み遅延時の増強や、DB・GI・OSの更新提案の対象になったOracleのデータベースサービス。","example":"移行支援の実体験では、顧客がCPUとメモリを増強した後、CPUの逼迫が改善し、取り込み処理と本番移行が完了した。","caution":"今回の構成で確認した停止・再起動・メモリ増加を、他のDBサービスや全BaseDB構成へ無条件に広げない。","sources":[],"referenceText":""},{"id":"patch","term":"パッチ適用・更新","fullName":"","definition":"不具合・脆弱性への対処やサポート期限などを踏まえ、対象ソフトウェアの更新を検討・実施すること。","example":"実体験の提案では、古さとばらつきを整理し、複数候補のSupport期限・手順・制約を示した。手順書ReviewとQA支援も提案した。","caution":"今回の提案は、見積もり作成への進展まで。適用完了・契約成立・Risk低減の実現を加えない。Patch適用かMajor Version変更か未確認の部分は区別する。","sources":[],"referenceText":""},{"id":"major-version","term":"メジャーバージョン","fullName":"","definition":"この会話では、19cなどの既存の系統を維持して更新する選択肢を考える際に用いたバージョンの区分。","example":"BaseDB更新候補は最新を基本にしつつ、互換性や既存の19cを維持する選択肢も考慮して複数提示した。","caution":"『最新へ更新』を、必ず別のMajor Versionへ移行する意味にしない。具体的な候補Release番号や顧客の最終採用は未確認。","sources":[],"referenceText":""},{"id":"compatibility","term":"互換性","fullName":"","definition":"更新候補と既存の構成・ソフトウェアの組み合わせで利用できるかを確認する観点。","example":"更新候補の比較で、最新Versionだけでなく、既存Major Versionを維持する案と手順・制約を整理した。","caution":"互換性を考慮して候補を出したことと、全顧客環境で互換性を実証したことは別。検証方法・範囲は必要時に確認する。","sources":[],"referenceText":""},{"id":"scale-up","term":"スケールアップ","fullName":"","definition":"CPUやメモリなど、既存リソースに割り当てる資源を増やすこと。今回のBaseDBではCPU増加に伴いメモリも増えた。","example":"取り込み遅延時、Supportへ暫定策として確認し、費用増・処理中断・再起動を説明したうえで、顧客が実施した。","caution":"必ず無停止、性能が比例する、失敗時に必ず即時に戻せるとは断定しない。CPUとメモリの効果を分離できていないためCPU単独の改善効果としない。","sources":[],"referenceText":""},{"id":"wait-event","term":"待機イベント","fullName":"Wait Event","definition":"処理が何かの完了や資源の利用を待っている理由を示す観測情報。DBではI/Oやロックなどの待ちを分類して調べる。","example":"SQLの遅延時間帯にロック待ちが増えていれば、競合している処理や保持元を確認する。","caution":"待ちがあるだけでは異常とは限らない。平常時との差、対象SQL、待ち時間と件数を併せて見る。","sources":[{"label":"Cloud SQL：Use system insights","url":"https://docs.cloud.google.com/sql/docs/postgres/use-system-insights"}],"referenceText":"Cloud SQL：Use system insights\nhttps://docs.cloud.google.com/sql/docs/postgres/use-system-insights"},{"id":"severity","term":"重大度","fullName":"Severity / Priority","definition":"障害の影響の大きさや対応の緊急性を分類する基準。業務停止の範囲、影響の程度、期限、回避策の有無を具体的に整理する。","example":"本番の主要業務が利用不能で回避策がないことを、ケースの優先度判断に使う。","caution":"SeverityとPriorityの名称・定義は組織やサービスで異なる。顧客の怒りの強さだけで決めず、契約と実影響を確認する。","sources":[{"label":"Google Cloud：Customer Care best practices","url":"https://docs.cloud.google.com/support/docs/best-practices"}],"referenceText":"Google Cloud：Customer Care best practices\nhttps://docs.cloud.google.com/support/docs/best-practices"},{"id":"escalation","term":"エスカレーション","fullName":"Escalation","definition":"通常の対応経路では解消できない停滞や影響拡大に対し、必要な判断・専門知識・権限を持つ相手へ支援を求めること。\n\n本チャットの補足：\nこの会話では、本番移行などの重要イベントに備え、関係チームへ事前に共有して支援を求める文脈でも使った。","example":"製品チームの担当者が確保できず、業務影響と期限を添えて人員配分の判断を責任者に依頼する。\n\n本チャットの補足：\n実体験では、自治体システムの本番移行を事前に重要イベントとして社内共有した。","caution":"連絡を上へ送っただけでは対応完了にならない。求める判断、担当者、次の確認時刻を明確にする。\n\n本チャットの補足：\n事前共有したことだけで、特定の担当者の確保や応答時間が保証された、当日の復旧時間を短縮したとはしない。","sources":[{"label":"Google Cloud：Customer Care best practices","url":"https://docs.cloud.google.com/support/docs/best-practices"},{"label":"Google SRE：Incident Response","url":"https://sre.google/workbook/incident-response/"}],"referenceText":"Google Cloud：Customer Care best practices\nhttps://docs.cloud.google.com/support/docs/best-practices\n\nGoogle SRE：Incident Response\nhttps://sre.google/workbook/incident-response/"},{"id":"sr","term":"SR","fullName":"","definition":"顧客からの問い合わせや調査を扱うサポートケース。この会話ではOracleでSRと呼ぶケースを指す。","example":"実体験では、移行時の取り込み遅延について顧客へSR起票を依頼し、サポート担当者と暫定策を確認した。","caution":"他社の面接では初回に『当社でSRと呼ぶサポートケース』と補足する。ケースの正式回答と、レビュー済みの進捗共有を区別する。","sources":[],"referenceText":""},{"id":"sro","term":"SRO","fullName":"","definition":"この会話では、そのサポートケースを担当するサポートエンジニアを指す。","example":"実体験の説明では、nozが整理した観測情報をケース担当者へ共有し、暫定対策の妥当性や顧客向け回答を確認する相手として登場する。","caution":"英語の正式名称は会話内で確認していないため補わない。TAMによる情報整理・顧客説明と、ケース担当者の技術的確認を分ける。","sources":[],"referenceText":""},{"id":"tam","term":"TAM","fullName":"Technical Account Manager","definition":"この会話では、顧客と社内専門チームをつなぎ、顧客課題・影響・担当者・次の行動を整理して支援を進める役割として説明した。","example":"nozの実体験は、障害対応、移行・メンテナンスの事前支援、顧客報告、課題に応じた支援の提案。","caution":"責任範囲は企業や求人によって異なる。製品開発、設計・実装、PoC、全チームへの指揮命令権を職名から推測しない。","sources":[],"referenceText":""},{"id":"rca","term":"RCA","fullName":"Root Cause Analysis","definition":"障害が起きた仕組みや寄与要因を、観測・検証に基づいて分析すること。再発リスクを減らす対策の根拠にする。","example":"負荷上昇、設定変更、依存先の挙動を時系列で照合し、再現や検証結果と合わせて説明する。\n\n本チャットの補足：\n実体験のBaseDB取り込み遅延では、Supportへ確認してCPUとメモリを増強し、取り込みが完了した。この経過だけでCPU不足が根本原因だったとは確定しない。","caution":"復旧した操作がそのまま根本原因の証明になるとは限らない。未確定の仮説や複数の寄与要因を区別する。\n\n本チャットの補足：\n変更候補を調査チームへ参考共有したことも、本人による根本原因の確定とは区別する。","sources":[{"label":"Google SRE：Postmortem Culture","url":"https://sre.google/workbook/postmortem-culture/"}],"referenceText":"Google SRE：Postmortem Culture\nhttps://sre.google/workbook/postmortem-culture/"},{"id":"on-call","term":"オンコール","fullName":"On-call","definition":"問題発生時に連絡を受け、決められた対応を行う当番体制。一次受け、専門家への連絡、交代・引き継ぎを含めて設計する。","example":"夜間のアラートを当番が受け、影響を確認して必要な専門チームを招集する。","caution":"当番がいることと、必要な専門知識や十分な人員が確保できることは別。応答がない場合の経路も必要。","sources":[{"label":"Google SRE：Incident Response","url":"https://sre.google/workbook/incident-response/"}],"referenceText":"Google SRE：Incident Response\nhttps://sre.google/workbook/incident-response/"},{"id":"postmortem","term":"ポストモーテム","fullName":"Postmortem","definition":"障害後に影響、経緯、原因・寄与要因、対応の良かった点と改善点を振り返り、再発防止や影響低減の行動へつなげる記録・活動。","example":"改善項目ごとに担当者、優先順位、期限、検証できる完了条件を定め、実施後の効果を追う。","caution":"個人を責める場や報告書の作成だけで終わらせない。原因分析に加え、検知・連携・顧客報告も対象にする。","sources":[{"label":"Google SRE：Postmortem Culture","url":"https://sre.google/workbook/postmortem-culture/"}],"referenceText":"Google SRE：Postmortem Culture\nhttps://sre.google/workbook/postmortem-culture/"},{"id":"ai-harness","term":"ハーネス","fullName":"","definition":"モデルに渡す情報・指示・ツール、処理順、出力形式、検証、失敗時の処理を、周辺の仕組みとして設計するもの。","example":"今回の改善案は、取得漏れの照合、原文参照付き判定、引用ID・引用文字列・必須項目の機械検証、不足時の未確認・停止・人への引継ぎ。","caution":"プロンプトを長くすることだけではない。この会話の改善案は本人の実装済み実績にしない。","sources":[{"label":"OpenAI：Agent improvement loop","url":"https://developers.openai.com/cookbook/examples/agents_sdk/agent_improvement_loop"}],"referenceText":"OpenAI：Agent improvement loop\nhttps://developers.openai.com/cookbook/examples/agents_sdk/agent_improvement_loop"},{"id":"ai-model","term":"AIモデル","fullName":"","definition":"情報の理解・生成・判断などを行うAI。長文、資料照合、ツール操作など、業務に必要な能力を踏まえて選ぶ対象。","example":"学習課題案では、ログの必要性への質問に手順だけ回答したケースなど、同じ入力で設定を一つずつ変え、問題の検出・根拠・余計な推測・人の修正時間を比較する。","caution":"入力が大量であることと意味判断が難しいことは別。モデルを変える前に、集計や照合をプログラムへ分ける選択肢もある。比較測定は本人の実施済み成果ではない。","sources":[{"label":"OpenAI：Codex models","url":"https://developers.openai.com/codex/models"},{"label":"OpenAI：Optimizing agents for cost and quality","url":"https://developers.openai.com/cookbook/examples/agent_optimization/optimizing_agents_for_cost_and_quality#optimization-round-2-model-selection"}],"referenceText":"OpenAI：Codex models\nhttps://developers.openai.com/codex/models\n\nOpenAI：Optimizing agents for cost and quality\nhttps://developers.openai.com/cookbook/examples/agent_optimization/optimizing_agents_for_cost_and_quality#optimization-round-2-model-selection"},{"id":"reasoning-effort","term":"思考量","fullName":"effort","definition":"曖昧さや選択肢の比較などについて、どれだけ検討させるかという設定・判断軸。モデル選択や処理手順とは分けて考える。","example":"複数資料で事実が食い違う判断と、決まった項目の単純な転記・集計では、必要な検討量を分けて考える。","caution":"増やすと複雑なTaskが改善する場合がある一方、時間やトークン量も増える。上げれば必ず正しくなる、時間に余裕があれば常に最大にする、とはしない。","sources":[{"label":"OpenAI：Codex models","url":"https://developers.openai.com/codex/models"}],"referenceText":"OpenAI：Codex models\nhttps://developers.openai.com/codex/models"},{"id":"ai-skill","term":"Skill","fullName":"","definition":"繰り返し行う作業の手順や判断条件を、再利用できる形にまとめる土台。","example":"本人はSRチェックのプロンプトをSkill化して部門へ展開し、業務フローと顧客の反応を部門全体会議で共有した。","caution":"手順を書いたことだけで、各実行時の取得漏れや判定ミスを防げたとはしない。必要な検証や不足時の処理は実行の仕組みに組み込む。","sources":[],"referenceText":""},{"id":"ai-workflow","term":"ワークフロー","fullName":"Workflow","definition":"情報収集、事実抽出、比較・判断、文章化、検証などを、どの順番と分担で進めるかという作業の流れ。","example":"本人の運用には、AIが挙げたケースを要約・原文確認してフォローする流れと、前日から更新されたケースの差分を要約・目視確認する別の流れがある。","caution":"別のAIフローを設けることは、別モデルを使うことや精度を独立検証できたことと同じではない。","sources":[],"referenceText":""},{"id":"human-review","term":"人による確認","fullName":"Human Review","definition":"AIが示した候補や要約を原文と照合し、実際の対応判断を人が行うこと。","example":"本人の運用では、AIが挙げた候補と前日からの更新差分を目視で確認する。全SRの全原文を毎日読む運用とは区別する。","caution":"抽出された候補の確認だけでは、AIが抽出しなかった案件の見落としまで保証できない。人の確認範囲を具体的に説明する。","sources":[],"referenceText":""},{"id":"evals","term":"Evals（評価）","fullName":"","definition":"業務用の例と人の判定を基準にして、AIの性能を体系的に測る評価。","example":"SRの例に人が『要フォロー・不要・保留』の判定を付け、AIの判定と照合する評価を検討する。","caution":"出力を一度見て良さそうだと判断することと、評価用例で性能を測ることは別。この会話で検討した評価案は、本人の実装・測定済み実績ではない。","sources":[{"label":"OpenAI：Evaluation best practices","url":"https://developers.openai.com/api/docs/guides/evaluation-best-practices"}],"referenceText":"OpenAI：Evaluation best practices\nhttps://developers.openai.com/api/docs/guides/evaluation-best-practices"},{"id":"evaluation-set","term":"評価用データ（人の事前判定を含む）","fullName":"","definition":"過去の例や匿名化・仮想例について、人が事前に期待する判定を付け、AIとの比較に使う材料。会話では正解データという表現も用いた。","example":"SRの要フォロー・不要・保留を人が判定した例を用意し、調整用の例と、変更後を確認する例を分ける。","caution":"人の判断基準を先にそろえる。調整で使った例への当てはまりだけで、別のケースにも通用するとしない。データ作成・運用は改善案として扱う。","sources":[{"label":"OpenAI：Evaluation best practices","url":"https://developers.openai.com/api/docs/guides/evaluation-best-practices"}],"referenceText":"OpenAI：Evaluation best practices\nhttps://developers.openai.com/api/docs/guides/evaluation-best-practices"},{"id":"regression-test","term":"回帰テスト","fullName":"","definition":"プロンプトやモデルを変更した際に、同じ評価例で改善と別ケースの悪化を確認すること。失敗例も評価に加える。","example":"SRの判定条件を直した後、以前拾えていた要フォロー案件を見落とすようになっていないか、同じ例で確認する。","caution":"一例が改善しただけで全体改善としない。この回帰確認の仕組みは今後の改善案で、本人の実装済み実績にはしない。","sources":[{"label":"OpenAI：Evaluation best practices","url":"https://developers.openai.com/api/docs/guides/evaluation-best-practices"}],"referenceText":"OpenAI：Evaluation best practices\nhttps://developers.openai.com/api/docs/guides/evaluation-best-practices"},{"id":"precision","term":"適合率","fullName":"","definition":"AIが挙げたもののうち、本当に要フォローだったものの割合。SR抽出では候補一覧への不要な混入を考える指標。","example":"AIの要フォロー候補一覧を、人の事前判定や原文確認と照合する。分母はAIが挙げた候補。","caution":"候補が正しいことと、必要な案件をすべて拾えたことは別。抽出されなかった案件の見落としは、再現率の観点で確認する。実測値は未確認。","sources":[{"label":"OpenAI：Evaluation best practices","url":"https://developers.openai.com/api/docs/guides/evaluation-best-practices"}],"referenceText":"OpenAI：Evaluation best practices\nhttps://developers.openai.com/api/docs/guides/evaluation-best-practices"},{"id":"recall","term":"再現率","fullName":"","definition":"評価例で人が要フォローとしたもののうち、AIが拾えたものの割合。SR抽出では必要な案件の見落としを考える指標。","example":"人が事前に要フォローと判定した一覧を基準にし、その中からAIが拾えた案件を確認する。","caution":"AIが挙げた候補の目視確認だけでは測れない。対象範囲と人の判定基準をそろえる。本人の再現率や見落とし率を測定済みとはしない。","sources":[{"label":"OpenAI：Evaluation best practices","url":"https://developers.openai.com/api/docs/guides/evaluation-best-practices"}],"referenceText":"OpenAI：Evaluation best practices\nhttps://developers.openai.com/api/docs/guides/evaluation-best-practices"},{"id":"structured-outputs","term":"Structured Outputs","fullName":"","definition":"出力する項目や形式を、指定したスキーマに準拠させる仕組み。","example":"改善案として、案件ID・判定・根拠などの出力項目を決め、必須項目や引用ID・文字列を機械的に確認する。","caution":"形式が合っていても内容が正しいとは限らない。引用が存在することと解釈が正しいことも別。本人の運用で利用済みとは断定しない。","sources":[{"label":"OpenAI：Structured Outputs","url":"https://developers.openai.com/api/docs/guides/structured-outputs"}],"referenceText":"OpenAI：Structured Outputs\nhttps://developers.openai.com/api/docs/guides/structured-outputs"},{"id":"harmful-use","term":"有害な利用の回避","fullName":"","definition":"加害や差別などにつながる用途を避けるための判断。この会話では、入力情報の取扱い許可とは別の観点として整理した。","example":"用途に有害性がないと判断しても、顧客情報をそのAI環境へ入力してよいかは、別に確認する。","caution":"有害な内容でないことだけで、顧客情報・個人情報・機密情報の入力が許可されるわけではない。","sources":[{"label":"会話で参照した一般資料：NIST AI RMF","url":"https://airc.nist.gov/airmf-resources/airmf/5-sec-core/"}],"referenceText":"会話で参照した一般資料：NIST AI RMF\nhttps://airc.nist.gov/airmf-resources/airmf/5-sec-core/"},{"id":"information-handling","term":"顧客情報・個人情報・機密情報の取扱い","fullName":"","definition":"会社の規程や情報分類を基に、情報・利用目的・AI環境・顧客との取扱条件を照合して、入力してよい範囲を判断すること。","example":"判断方針のモデルでは、必要な情報と許可条件を確認し、不明なら該当情報の入力を保留して規程の担当者や情報の責任者へ照会する。","caution":"人名・メールアドレスを一律禁止とも、一律入力可能とも断定しない。各社の規程・許可が異なるため、一般資料だけで自社の許可を確定しない。","sources":[{"label":"会話で参照した一般資料：Google Cloud AI/ML security","url":"https://docs.cloud.google.com/architecture/framework/perspectives/ai-ml/security"}],"referenceText":"会話で参照した一般資料：Google Cloud AI/ML security\nhttps://docs.cloud.google.com/architecture/framework/perspectives/ai-ml/security"},{"id":"approved-ai-environment","term":"承認されたAI利用環境","fullName":"","definition":"会社が利用を認めたツールやアカウント等の環境。今回のデータと用途が、その許可範囲に含まれるかも確認する。","example":"判断方針のモデルでは、承認済みツールであっても、情報分類や顧客との取扱条件に適合するかを確認してから入力する。","caution":"会社承認は全情報・全用途の許可と同じではない。便利さ、安全そうという印象、他の人の利用だけで許可を決めない。","sources":[],"referenceText":""},{"id":"data-minimization","term":"入力する情報を必要な範囲に絞る","fullName":"","definition":"作業目的と許可範囲を確認したうえで、その目的に必要な情報に入力を限定する考え方。","example":"判断方針のモデルでは、要約や比較に必要な部分を選び、判断に不要な情報まで一括で渡す必要があるかを見直す。","caution":"入力を減らしたことだけで利用許可が成立するわけではない。必要な判断材料まで落として、出力の正確さを損なわないようにする。本人の全業務で実施済みとは述べない。","sources":[],"referenceText":""},{"id":"identifier-redaction","term":"識別情報を伏せる・置き換える","fullName":"","definition":"顧客名などの識別情報をそのまま出さず、必要に応じて伏せたり一般化したりする扱い。この会話では選択可能な判断方針として説明した。","example":"面接回答では顧客名・自治体名・内部URLを一般化する。AI入力では、その方法で取扱条件を満たすかを確認して用いる。","caution":"別の文脈から再特定できる場合があるため、伏せるだけで許可されたとはしない。本人がAI入力の全情報を匿名化しているという実績には変えない。","sources":[],"referenceText":""}]}</script>
  <script>(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('study-data').textContent);
  const root = document.getElementById('app');
  const questions = data.questions;
  const byId = new Map(questions.map(q => [q.id, q]));
  const termsById = new Map(data.glossary.map(t => [t.id, t]));
  const storageKey = 'noz-cloud-tam-drill-v1:' + (location.protocol === 'file:' ? 'local' : new URL('.', location.href).pathname);
  const sizes = [90, 100, 115, 130];
  const sizeNames = ['小', '標準', '大', '特大'];
  const esc = value => String(value ?? '').replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
  const icons = {book:'<path d="M3 4h5a4 4 0 0 1 4 3v14a4 4 0 0 0-4-3H3zM12 7a4 4 0 0 1 4-3h5v14h-5a4 4 0 0 0-4 3"/>',list:'<path d="M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01"/>',next:'<path d="M5 12h14m-6-6 6 6-6 6"/>',prev:'<path d="M19 12H5m6-6-6 6 6 6"/>',hint:'<path d="M9 18h6m-6 3h6M8 14a7 7 0 1 1 8 0c-1 1-1 2-1 3H9c0-1 0-2-1-3"/>',check:'<path d="m4 12 5 5L20 6"/>',review:'<path d="M3 10a9 9 0 1 1 2 8M3 3v7h7"/>',down:'<path d="m6 9 6 6 6-6"/>',settings:'<path d="M4 7h16M4 17h16M8 4v6M16 14v6"/>'};
  const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.book}</svg>`;
  function safeUrl(value) { try {const u = new URL(value); return ['https:', 'http:'].includes(u.protocol) ? u.href : '';} catch {return '';}}
  function inline(text) {
    const pattern = /\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s<>「」]+/g;
    let result = '', end = 0;
    for (const m of String(text).matchAll(pattern)) {
      result += esc(text.slice(end, m.index)); const token = m[0];
      if (token.startsWith('**')) result += '<strong>' + esc(token.slice(2, -2)) + '</strong>';
      else if (token.startsWith('`')) result += '<code>' + esc(token.slice(1, -1)) + '</code>';
      else {const markdown = token.match(/^\[([^\]]+)\]\((.+)\)$/); const url = safeUrl(markdown ? markdown[2] : token); result += url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(markdown ? markdown[1] : token)}</a>` : esc(token);}
      end = m.index + token.length;
    }
    return result + esc(String(text).slice(end));
  }
  function rich(value) {
    if (!value) return '';
    return String(value).split(/\n\s*\n/).filter(Boolean).map(block => {
      const lines = block.trim().split('\n');
      if (lines.every(line => /^\s*[-・●]\s*/.test(line))) return '<ul>' + lines.map(line => '<li>' + inline(line.replace(/^\s*[-・●]\s*/, '')) + '</li>').join('') + '</ul>';
      if (lines.every(line => /^\s*\d+[.．、)]\s*/.test(line))) return '<ol>' + lines.map(line => '<li>' + inline(line.replace(/^\s*\d+[.．、)]\s*/, '')) + '</li>').join('') + '</ol>';
      if (/^#{1,4}\s/.test(block)) return '<h4>' + inline(block.replace(/^#{1,4}\s*/, '')) + '</h4>';
      return '<p>' + lines.map(inline).join('<br>') + '</p>';
    }).join('');
  }
  let saved = {}, storageAvailable = true;
  try {saved = JSON.parse(localStorage.getItem(storageKey) || '{}'); if (!saved || typeof saved !== 'object') saved = {}; localStorage.setItem(storageKey + ':test', '1'); localStorage.removeItem(storageKey + ':test');} catch {storageAvailable = false; saved = {};}
  const reviews = {}, memos = {};
  for (const [id, value] of Object.entries(saved.reviews || {})) if (byId.has(id) && ['review','spoken'].includes(value)) reviews[id] = value;
  for (const [id, value] of Object.entries(saved.memos || {})) if (byId.has(id) && typeof value === 'string') memos[id] = value.slice(0, 10000);
  let fontSize = sizes.includes(saved.fontSize) ? saved.fontSize : 100;
  let selectedId = byId.has(saved.lastId) ? saved.lastId : questions[0].id;
  let view = 'drill', theme = 'all', scope = 'all', order = 'ordered', search = '', termSearch = '', focusedTerm = '';
  let revealed = false, hint = false, randomIds = [], deferredInstall = null, swRegistration = null;
  let updateReady = false, offlineReady = false, toastTimer;
  const unanswered = q => !q.answer.trim() || /^未回答(?:\s|$|[。．：:（(])/.test(q.answer.trim());
  const statusLabel = q => {
    const status = q.status || '';
    if (unanswered(q)) return '未回答';
    if (/^(要本人確認|要確認)/.test(status)) return '要本人確認';
    if (/^仮想回答/.test(status)) return '仮想回答';
    if (/^未実施/.test(status)) return '未実施の提案';
    if (/^(知識整理|一般|学習|このチャットで説明した一般|このチャットの一般|このチャットの学習|この会話で整理した一般|\d{4}-\d{2}-\d{2}にこのチャットで作成した一般)/.test(status)) return '知識・一般例';
    if (/^(本人経験|本人実績|本人承認済みの提案事例|当該移行での本人経験|最新の本人確認に基づく実績)/.test(status)) return '経験・実績';
    return '';
  };
  const reviewLabel = id => reviews[id] === 'spoken' ? '話せた' : reviews[id] === 'review' ? '要復習' : '未評価';
  function save() {try {localStorage.setItem(storageKey, JSON.stringify({version:1, reviews, memos, fontSize, lastId:selectedId}));} catch {if (storageAvailable) toast('この環境では保存できません。設定から学習記録を書き出せます。'); storageAvailable = false;}}
  function toast(message) {clearTimeout(toastTimer); const el = document.getElementById('toast'); el.textContent = message; el.hidden = false; toastTimer = setTimeout(() => {el.hidden = true;}, 3300);}
  function applySize() {document.documentElement.style.fontSize = (16 * fontSize / 100) + 'px'; document.querySelectorAll('[data-size]').forEach(el => el.setAttribute('aria-pressed', Number(el.dataset.size) === fontSize));}
  function sizeControls() {return `<div class="size-control"><span>文字サイズ</span><div class="size-buttons" role="group" aria-label="文字サイズ">${sizes.map((n,i) => `<button data-action="size" data-size="${n}" aria-label="文字サイズ ${sizeNames[i]} ${n}%" aria-pressed="${fontSize === n}">${sizeNames[i]}</button>`).join('')}</div></div>`;}
  function stats() {return `<div class="counts"><span>全質問<b>${questions.length}</b></span><span class="review">要復習<b>${Object.values(reviews).filter(x => x === 'review').length}</b></span><span>話せた<b>${Object.values(reviews).filter(x => x === 'spoken').length}</b></span></div>`;}
  function shuffle() {randomIds = questions.map(q => q.id); for(let i = randomIds.length-1; i > 0; i--) {const j = Math.floor(Math.random()*(i+1)); [randomIds[i], randomIds[j]] = [randomIds[j], randomIds[i]];}}
  function filtered(query = '') {
    const words = query.normalize('NFKC').toLowerCase().trim().split(/\s+/).filter(Boolean);
    const result = questions.filter(q => (theme === 'all' || q.theme === theme) && (scope === 'all' || scope === 'unrated' && !reviews[q.id] || scope === 'unanswered' && unanswered(q) || reviews[q.id] === scope) && words.every(word => [q.id,q.question,q.answer,q.points,q.notes,q.theme].join(' ').normalize('NFKC').toLowerCase().includes(word)));
    if (view === 'drill' && order === 'random') {const rank = new Map(randomIds.map((id,i) => [id,i])); result.sort((a,b) => rank.get(a.id)-rank.get(b.id));}
    return result;
  }
  function ensureSelected() {const items = filtered(); if (!items.some(q => q.id === selectedId)) selectedId = items[0]?.id || ''; return items;}
  function badge(q) {const label = statusLabel(q); return label ? `<span class="badge ${/確認|未回答/.test(label) ? 'caution' : 'status'}">${esc(label)}</span>` : '';}
  function filters(withSearch = false) {
    const themes = [...new Set(questions.map(q => q.theme))];
    return `<div class="filters">${withSearch ? `<div class="field search"><label for="question-search">質問・回答・ポイントを検索</label><input type="search" id="question-search" value="${esc(search)}" placeholder="例：信頼回復、切り戻し"></div>` : ''}<div class="field"><label for="theme-filter">テーマ</label><select id="theme-filter"><option value="all">すべてのテーマ</option>${themes.map(t => `<option value="${esc(t)}" ${theme === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div><div class="field"><label for="scope-filter">${withSearch ? '表示する質問' : '出題範囲'}</label><select id="scope-filter">${[['all','全質問'],['review','要復習'],['spoken','話せた'],['unrated','未評価'],['unanswered','回答未作成']].map(([id,label]) => `<option value="${id}" ${scope === id ? 'selected' : ''}>${label}</option>`).join('')}</select></div>${withSearch ? '' : `<div class="field"><label for="order-filter">出題順</label><select id="order-filter"><option value="ordered" ${order === 'ordered' ? 'selected' : ''}>Excelの掲載順</option><option value="random" ${order === 'random' ? 'selected' : ''}>ランダム</option></select></div>`}</div>`;
  }
  function heading(title, description, count = true) {return `<div class="page-heading"><div><h1>${title}</h1><p class="subtitle">${description}</p></div>${count ? stats() : `<div class="counts"><span>収録用語<b>${data.glossary.length}</b></span></div>`}</div><div class="eyeline"><span class="content-date">教材更新 ${esc(data.updatedAt)} <span class="offline-dot" id="offline-status">${offlineReady ? ' · オフライン利用可能' : ''}</span></span>${sizeControls()}</div>`;}
  function rating(q) {return `<button class="btn small" data-action="rate" data-id="${esc(q.id)}" data-rating="review" aria-pressed="${reviews[q.id] === 'review'}">${icon('review')}要復習</button><button class="btn small spoken" data-action="rate" data-id="${esc(q.id)}" data-rating="spoken" aria-pressed="${reviews[q.id] === 'spoken'}">${icon('check')}話せた</button>`;}
  function answer(q, pointsOnly = false) {
    const questionLinks = (q.relatedQuestions || []).filter(id => byId.has(id) && id !== q.id);
    const termLinks = (q.relatedTerms || []).filter(id => termsById.has(id));
    return `<div class="answer-region">${pointsOnly ? '' : `<section class="answer-section"><h3 class="section-title">${icon('book')}模範回答</h3>${unanswered(q) ? `<div class="answer-empty">Excelでは、まだ回答が作成されていません。以下のポイントを確認できます。</div>` : ''}<div class="rich answer-body">${rich(q.answer)}</div></section>`}${q.points ? `<section class="answer-section point-section"><h3 class="section-title">${icon('hint')}考え方・ポイント</h3><div class="rich">${rich(q.points)}</div></section>` : pointsOnly ? `<section class="answer-section"><p class="subtitle">この質問のポイントは、まだ登録されていません。</p></section>` : ''}${!pointsOnly && q.notes ? `<section class="answer-section notes-section"><h3 class="section-title">注意点・深掘り</h3><div class="rich">${rich(q.notes)}</div></section>` : ''}${!pointsOnly && questionLinks.length ? `<section class="answer-section"><h3 class="section-title">関連する質問</h3><div class="related">${questionLinks.map(id => `<a class="chip" href="#/drill/${encodeURIComponent(id)}">${esc(id)} ${esc(byId.get(id).question)} ${icon('next')}</a>`).join('')}</div></section>` : ''}${!pointsOnly && termLinks.length ? `<section class="answer-section"><h3 class="section-title">関連用語</h3><div class="related">${termLinks.map(id => `<a class="chip" href="#/glossary/${encodeURIComponent(id)}">${esc(termsById.get(id).term)} ${icon('next')}</a>`).join('')}</div></section>` : ''}</div>`;
  }
  function drill() {
    const items = ensureSelected(), q = byId.get(selectedId), i = items.findIndex(x => x.id === selectedId);
    const top = heading('面接ドリル', '自分の言葉で答えてから、模範回答と判断のポイントを確認。') + filters();
    if (!q) return top + `<div class="empty"><h2>この条件に合う質問はありません</h2><p>テーマや出題範囲を変更してください。</p><button class="btn" data-action="reset-filters">全質問に戻る</button></div>`;
    return top + `<div class="progress"><div class="progress-track" role="progressbar" aria-label="現在の出題位置" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${i+1}"><div class="progress-fill" style="width:${(i+1)/items.length*100}%"></div></div><span>${i+1} / ${items.length}</span></div><article class="question-card"><div class="question-top"><div class="meta"><span class="id" title="B：主に経験・行動面、T：主に技術・運用面。教材の管理用IDです。">${esc(q.id)}</span><span class="badge">${esc(q.theme)}</span>${badge(q)}${reviews[q.id] ? `<span class="badge status">${reviewLabel(q.id)}</span>` : ''}</div>${q.context ? `<div class="question-context"><small>この質問の場面</small>${esc(q.context)}</div>` : ''}<h2 class="question" id="current-question">${esc(q.question)}</h2><div class="actions"><button class="btn primary" data-action="reveal" aria-expanded="${revealed}">${icon('book')}${revealed ? '回答を閉じる' : '模範回答を見る'}</button><button class="btn" data-action="next">次の質問 ${icon('next')}</button><button class="btn quiet" data-action="hint" aria-expanded="${hint || revealed}">${icon('hint')}考え方のヒント</button><span class="spacer"></span><button class="btn quiet" data-action="previous" ${i === 0 ? 'disabled' : ''}>${icon('prev')}前へ</button></div></div>${revealed ? answer(q) : hint ? answer(q,true) : ''}${revealed ? `<div class="practice-footer"><span class="small-label">振り返り</span>${rating(q)}<span class="spacer"></span><button class="btn small" data-action="next">次の質問 ${icon('next')}</button></div>` : ''}</article><div class="keyboard"><span><kbd>Space</kbd> 回答を表示</span><span><kbd>←</kbd> <kbd>→</kbd> 前後の質問</span><span>「話せた」は自分で付ける振り返りです。</span></div><details class="memo"><summary>練習メモ（任意）${memos[q.id] ? ' · 保存済み' : ''}</summary><label class="sr-only" for="answer-memo">この質問の練習メモ</label><textarea id="answer-memo" data-id="${esc(q.id)}" maxlength="10000" placeholder="詰まった点や、次に話したいこと">${esc(memos[q.id] || '')}</textarea><p class="memo-help">入力内容はこのブラウザに自動保存します。</p></details>`;
  }
  function libraryResults() {
    const items = filtered(search);
    return `<div class="results-label"><span><b>${items.length}</b> 件の質問</span><span>質問を開くと、回答と補足を表示</span></div><div class="question-list">${items.map(q => `<details class="question-row" data-id="${esc(q.id)}"><summary><span class="id">${esc(q.id)}</span><span class="row-main"><span class="row-question">${esc(q.question)}</span><span class="row-meta"><span class="badge">${esc(q.theme)}</span>${badge(q)}${reviews[q.id] ? `<span class="badge status">${reviewLabel(q.id)}</span>` : ''}</span></span><span class="row-chevron">${icon('down')}</span></summary><div class="row-content"></div></details>`).join('') || '<div class="empty"><h2>一致する質問はありません</h2><p>検索語や絞り込み条件を変更してください。</p></div>'}</div>`;
  }
  function library() {return heading('質問・回答一覧', '模範回答、考え方、注意点をまとめて確認。') + filters(true) + `<div id="library-results">${libraryResults()}</div>`;}
  function termResults() {
    const words = termSearch.normalize('NFKC').toLowerCase().trim().split(/\s+/).filter(Boolean);
    const terms = data.glossary.filter(t => words.every(word => [t.term,t.fullName,t.definition,t.example,t.caution].join(' ').normalize('NFKC').toLowerCase().includes(word)));
    if (focusedTerm) terms.sort((a,b) => (b.id === focusedTerm ? 1 : 0) - (a.id === focusedTerm ? 1 : 0));
    return `<div class="results-label"><span><b>${terms.length}</b> 語</span><span>意味・具体例・注意点</span></div><div class="term-grid">${terms.map(t => `<article class="term ${t.id === focusedTerm ? 'focused' : ''}" id="term-${esc(t.id)}"><h2>${esc(t.term)}</h2><p class="term-full">${esc(t.fullName || '')}</p><div class="rich">${rich(t.definition)}</div>${t.example ? `<div class="term-detail"><h3>具体例</h3><div class="rich">${rich(t.example)}</div></div>` : ''}${t.caution ? `<div class="term-detail pitfall"><h3>注意点・混同しやすいこと</h3><div class="rich">${rich(t.caution)}</div></div>` : ''}${(t.sources || []).length ? `<div class="sources">${t.sources.map(s => safeUrl(s.url) ? `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.label || '参考資料')} ↗</a>` : '').join('')}</div>` : ''}</article>`).join('') || '<div class="empty"><h2>一致する用語はありません</h2><p>別のキーワードで検索してください。</p></div>'}</div>`;
  }
  function glossary() {return heading('クラウドTAMの用語集', '意味を理解して、お客様への説明と判断につなげる。', false) + `<div class="filters"><div class="field search"><label for="term-search">用語・説明を検索</label><input type="search" id="term-search" placeholder="例：SLO、停止時間、待ち時間" value="${esc(termSearch)}"></div></div><div id="term-results">${termResults()}</div>`;}
  function dialog() {return `<dialog class="dialog" id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-head"><h2 id="settings-title">表示・学習データ</h2><button class="close" data-action="close-settings" aria-label="設定を閉じる">×</button></div>${sizeControls()}<h3>スマホのホーム画面に追加</h3><p>公開後のサイトをブラウザで開いて追加できます。</p><ol><li>iPhone / iPad：Safariの共有メニューから「ホーム画面に追加」。</li><li>Android：Chromeのメニューから「ホーム画面に追加」または「アプリをインストール」。</li></ol><button class="btn small" id="install-button" data-action="install" ${deferredInstall ? '' : 'hidden'}>アプリをインストール</button><p>初回のオンライン読み込みと保存完了後は、オフラインでも復習できます。HTMLファイルを直接開いた場合は、ホーム画面への追加・オフライン保存機能は利用できません。</p><h3>学習記録のバックアップ</h3><p>自己評価・練習メモ・文字サイズはこのブラウザに保存します。スマホとPCで自動同期はしません。書き出したJSONを別端末で読み込むと引き継げます。同じ質問IDの自己評価・メモは、読み込んだ内容で上書きします。</p><div class="actions"><button class="btn small" data-action="export">学習記録を書き出す</button><button class="btn small" data-action="import">学習記録を読み込む</button><input type="file" id="import-progress" accept="application/json,.json" hidden></div><h3>B・Tとは？</h3><p>Bは主に経験・行動面、Tは主に技術・運用面の質問を識別する管理用IDです。Googleの公式分類ではありません。画面の分類は「テーマ」で確認できます。</p><h3>教材について</h3><p>Excelの質問・回答と用語集をもとにした個人用教材です。回答中の太字はExcelの **重要な部分** を反映しています。最新の会話は、Excelへ反映後にサイトを再生成すると追加されます。</p><p>更新日：${esc(data.updatedAt)} ／ 収録：${questions.length}問・${data.glossary.length}語</p></dialog>`;}
  function shell(main) {return `<header class="site-header"><div class="header-inner"><a class="brand" href="#/drill"><span class="brand-mark">T</span><span><span class="eyebrow">INTERVIEW PRACTICE</span><br><span class="brand-name">Cloud TAM 面接ドリル</span></span></a><div class="header-tools"><nav class="nav" aria-label="メインメニュー">${[['drill','ドリル','book'],['library','質問・回答一覧','list'],['glossary','用語集','book']].map(([id,label,ic]) => `<a href="#/${id}" ${view === id ? 'aria-current="page"' : ''}>${icon(ic)}${label}</a>`).join('')}</nav><button class="settings-btn" data-action="settings" aria-label="設定を開く">${icon('settings')}<span class="settings-text">設定</span></button></div></div></header><div class="update-banner" id="update-banner" ${updateReady ? '' : 'hidden'}><span>教材の新しいバージョンがあります。</span><button class="btn small" data-action="update">更新して読み込む</button></div><main class="main" id="main" tabindex="-1">${storageAvailable ? '' : '<div class="storage-warning">このブラウザでは学習記録を保存できません。設定から記録を書き出せます。</div>'}${main}<footer class="site-footer"><span>Cloud TAM 面接ドリル · v1.0</span><span>自己評価・練習メモはこのブラウザに保存されます。</span></footer></main>${dialog()}`;}
  function render() {root.innerHTML = shell(view === 'drill' ? drill() : view === 'library' ? library() : glossary()); applySize(); if (view === 'drill' && selectedId) {history.replaceState(null,'', '#/drill/' + encodeURIComponent(selectedId)); save();}}
  function route() {let parts; try {parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);} catch {parts = [];}
    view = ['drill','library','glossary'].includes(parts[0]) ? parts[0] : 'drill';
    if (view === 'drill' && byId.has(parts[1])) {selectedId = parts[1]; if (!filtered().some(q => q.id === selectedId)) {theme = 'all'; scope = 'all';}}
    focusedTerm = view === 'glossary' && termsById.has(parts[1]) ? parts[1] : ''; if (focusedTerm) termSearch = '';
    revealed = false; hint = false; render();
  }
  function next(direction = 1) {const items = filtered(); if (!items.length) return; const i = items.findIndex(q => q.id === selectedId); if (direction < 0 && i <= 0) return; const index = (i+direction+items.length)%items.length; selectedId = items[index].id; revealed = hint = false; render(); document.getElementById('current-question')?.scrollIntoView({block:'start',behavior:'instant'}); if (index === 0 && direction > 0) toast('この範囲の先頭に戻りました');}
  function fillRow(row) {const q = byId.get(row.dataset.id); const el = row.querySelector('.row-content'); if (q && el && !el.childElementCount) el.innerHTML = answer(q) + `<div class="row-actions">${rating(q)}<a class="btn small primary" href="#/drill/${encodeURIComponent(q.id)}">この質問を練習 ${icon('next')}</a></div>`;}
  root.addEventListener('toggle', event => {if (event.target.matches('.question-row') && event.target.open) fillRow(event.target);}, true);
  root.addEventListener('click', async event => {
    const button = event.target.closest('[data-action]'); if (!button) return; const action = button.dataset.action;
    if (action === 'size') {fontSize = Number(button.dataset.size); applySize(); save(); return;}
    if (action === 'settings') {document.getElementById('settings-dialog').showModal(); return;}
    if (action === 'close-settings') {document.getElementById('settings-dialog').close(); return;}
    if (action === 'next') {next(); return;}
    if (action === 'previous') {next(-1); return;}
    if (action === 'reveal') {revealed = !revealed; hint = false; render(); root.querySelector('[data-action="reveal"]')?.focus({preventScroll:true}); return;}
    if (action === 'hint') {if (revealed) document.querySelector('.point-section')?.scrollIntoView({block:'start'}); else {hint = !hint; render(); root.querySelector('[data-action="hint"]')?.focus({preventScroll:true});} return;}
    if (action === 'reset-filters') {theme = scope = 'all'; render(); return;}
    if (action === 'rate') {const id = button.dataset.id; const openIds = [...root.querySelectorAll('.question-row[open]')].map(row => row.dataset.id); const before = filtered(); const index = before.findIndex(q => q.id === selectedId);
      if (reviews[id] === button.dataset.rating) delete reviews[id]; else reviews[id] = button.dataset.rating;
      if (view === 'drill' && !filtered().some(q => q.id === selectedId)) {selectedId = filtered()[Math.max(0,Math.min(index,filtered().length-1))]?.id || ''; revealed = hint = false;}
      save(); render(); for (const row of root.querySelectorAll('.question-row')) if (openIds.includes(row.dataset.id)) {row.open = true; fillRow(row);} toast(reviewLabel(id) === '未評価' ? '自己評価を未評価に戻しました' : '「' + reviewLabel(id) + '」にしました'); return;
    }
    if (action === 'export') {const json = JSON.stringify({app:'cloud-tam-drill',version:1,exportedAt:new Date().toISOString(),reviews,memos,fontSize,lastId:selectedId}, null, 2); const url = URL.createObjectURL(new Blob([json],{type:'application/json'})); const a = document.createElement('a'); a.href = url; a.download = 'tam-drill-progress.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); return;}
    if (action === 'import') {document.getElementById('import-progress').click(); return;}
    if (action === 'install' && deferredInstall) {await deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; button.hidden = true; return;}
    if (action === 'update') {save(); if (swRegistration?.waiting) swRegistration.waiting.postMessage({type:'ACTIVATE'}); else location.reload();}
  });
  root.addEventListener('change', async event => {
    const target = event.target;
    if (target.id === 'import-progress') {const file = target.files?.[0]; if (!file) return; try {if (file.size > 20000000) throw new Error('size'); const value = JSON.parse(await file.text()); if (value.app !== 'cloud-tam-drill' || value.version !== 1 || typeof value.reviews !== 'object' || typeof value.memos !== 'object' || !value.reviews || !value.memos) throw new Error('format');
      let count = 0; for (const [id,r] of Object.entries(value.reviews)) if (byId.has(id) && ['review','spoken'].includes(r)) {reviews[id] = r; count++;} for (const [id,m] of Object.entries(value.memos)) if (byId.has(id) && typeof m === 'string') memos[id] = m.slice(0,10000); if (sizes.includes(value.fontSize)) fontSize = value.fontSize; save(); render(); toast(`学習記録を読み込みました（自己評価 ${count}件）`);
    } catch {toast('このドリルから書き出したJSONファイルを選択してください。');} return;}
    if (target.id === 'theme-filter') theme = target.value; else if (target.id === 'scope-filter') scope = target.value; else if (target.id === 'order-filter') {order = target.value; if (order === 'random') shuffle();} else return;
    revealed = hint = false; if (view === 'drill') selectedId = filtered()[0]?.id || ''; render();
  });
  root.addEventListener('input', event => {const target = event.target; if (target.id === 'question-search') {search = target.value; document.getElementById('library-results').innerHTML = libraryResults();} else if (target.id === 'term-search') {termSearch = target.value; focusedTerm = ''; document.getElementById('term-results').innerHTML = termResults();} else if (target.id === 'answer-memo') {memos[target.dataset.id] = target.value; save();}});
  document.querySelector('.skip-link').addEventListener('click', event => {event.preventDefault(); document.getElementById('main')?.focus();});
  window.addEventListener('hashchange', () => {route(); window.scrollTo({top:0,behavior:'instant'});});
  document.addEventListener('keydown', event => {if (view !== 'drill' || document.getElementById('settings-dialog')?.open || event.ctrlKey || event.altKey || event.metaKey || event.target.closest('input,textarea,select,button,a,summary,[contenteditable]')) return; if (event.code === 'Space') {event.preventDefault(); revealed = !revealed; hint = false; render();} else if (event.code === 'ArrowRight') {event.preventDefault(); next();} else if (event.code === 'ArrowLeft') {event.preventDefault(); next(-1);}});
  window.addEventListener('beforeinstallprompt', event => {event.preventDefault(); deferredInstall = event; const button = document.getElementById('install-button'); if (button) button.hidden = false;});
  let refreshPending = false;
  if ('serviceWorker' in navigator && ['https:','http:'].includes(location.protocol) && window.isSecureContext) {
    navigator.serviceWorker.addEventListener('controllerchange', () => {if (updateReady && !refreshPending) {refreshPending = true; location.reload();}});
    window.addEventListener('load', async () => {try {swRegistration = await navigator.serviceWorker.register('./sw.js', {scope:'./',updateViaCache:'none'}); const showUpdate = () => {updateReady = true; const banner = document.getElementById('update-banner'); if (banner) banner.hidden = false;}; if (swRegistration.waiting && navigator.serviceWorker.controller) showUpdate();
      swRegistration.addEventListener('updatefound', () => {const worker = swRegistration.installing; worker?.addEventListener('statechange', () => {if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdate();});});
      await navigator.serviceWorker.ready; offlineReady = true; const el = document.getElementById('offline-status'); if (el) el.textContent = ' · オフライン利用可能';
    } catch { /* Reading the complete embedded lesson remains available without offline caching. */ }});
  }
  shuffle(); route();
})();
</script>
